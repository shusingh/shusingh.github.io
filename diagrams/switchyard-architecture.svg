<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 916" width="1120" height="916">
  <title>Switchyard architecture: request path and control plane</title>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#1a1a1f" fill-opacity="0.07"/>
    </pattern>
    <filter id="lift" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1a1a1f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-request" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1f"/>
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16407a"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#67635b"/>
    </marker>
    <style>
      .label { font-family: 'Hanken Grotesk'; font-size: 16px; font-weight: 600; fill: #1a1a1f; text-anchor: middle; }
      .detail { font-family: 'JetBrains Mono'; font-size: 12.5px; fill: #67635b; text-anchor: middle; }
      .zone { font-family: 'JetBrains Mono'; font-size: 11.5px; font-weight: 500; letter-spacing: 1.2px; }
      .pill { font-family: 'JetBrains Mono'; font-size: 11.5px; fill: #3a3833; text-anchor: middle; }
      .badge { font-family: 'JetBrains Mono'; font-size: 11.5px; font-weight: 500; fill: #f7f3eb; text-anchor: middle; }
      .heading { font-family: 'JetBrains Mono'; font-size: 12px; font-weight: 500; letter-spacing: 1.4px; fill: #67635b; }
      .step { font-family: 'Hanken Grotesk'; font-size: 14.5px; fill: #3a3833; }
      .box { fill: #fbf8f2; stroke: #1a1a1f; stroke-opacity: 0.22; stroke-width: 1; }
      .request { fill: none; stroke: #1a1a1f; stroke-width: 1.6; }
      .event { fill: none; stroke: #16407a; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .control { fill: none; stroke: #67635b; stroke-width: 1.3; stroke-dasharray: 2 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1120" height="916" fill="#f7f3eb"/>
  <rect width="1120" height="916" fill="url(#dots)"/>

  <!-- Title -->
  <text x="40" y="44" class="heading">SWITCHYARD  /  REQUEST PATH AND CONTROL PLANE</text>
  <text x="1080" y="44" class="heading" text-anchor="end">FIG. 1</text>
  <line x1="40" y1="56" x2="1080" y2="56" stroke="#1a1a1f" stroke-opacity="0.12"/>

  <!-- Zones -->
  <rect x="40" y="170" width="1040" height="300" rx="10" fill="#16407a" fill-opacity="0.035" stroke="#16407a" stroke-opacity="0.45" stroke-dasharray="7 5"/>
  <text x="1060" y="194" class="zone" fill="#16407a" text-anchor="end">SWITCHYARD ROUTER  /  ONE GO BINARY</text>
  <rect x="40" y="520" width="1040" height="160" rx="10" fill="#c0432e" fill-opacity="0.035" stroke="#c0432e" stroke-opacity="0.45" stroke-dasharray="7 5"/>
  <text x="60" y="664" class="zone" fill="#c0432e">GPU HOST  /  1 &#215; RTX 4090, REFERENCE SETUP</text>

  <!-- Edges: control plane -->
  <path class="control" d="M175,438 L175,548" marker-end="url(#arrow-control)"/>
  <path class="control" d="M960,290 L960,360" marker-end="url(#arrow-control)"/>

  <!-- Edges: event streams -->
  <path class="event" d="M425,548 L425,438" marker-end="url(#arrow-event)"/>
  <path class="event" d="M530,399 L570,399" marker-end="url(#arrow-event)"/>

  <!-- Edges: request path -->
  <path class="request" d="M175,136 L175,212" marker-end="url(#arrow-request)"/>
  <path class="request" d="M280,251 L320,251" marker-end="url(#arrow-request)"/>
  <path class="request" d="M530,251 L570,251" marker-end="url(#arrow-request)"/>
  <path class="request" d="M640,290 L640,360" marker-end="url(#arrow-request)"/>
  <path class="request" d="M740,290 L740,319 Q740,325 746,325 L874,325 Q880,325 880,331 L880,360" marker-end="url(#arrow-request)"/>
  <path class="request" d="M780,251 L820,251" marker-end="url(#arrow-request)"/>
  <path class="request" d="M1030,251 L1054,251 Q1060,251 1060,257 L1060,581 Q1060,587 1054,587 L1030,587" marker-end="url(#arrow-request)"/>

  <!-- Nodes: clients (external) -->
  <rect x="70" y="72" width="210" height="64" rx="8" fill="none" stroke="#67635b" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="175" y="99" class="label">Clients</text>
  <text x="175" y="119" class="detail">OpenAI SDKs, agents</text>

  <!-- Nodes: router, request path -->
  <g filter="url(#lift)">
    <rect class="box" x="70" y="212" width="210" height="78" rx="6"/>
    <rect class="box" x="320" y="212" width="210" height="78" rx="6"/>
    <rect x="570" y="212" width="210" height="78" rx="6" fill="#fbf8f2" stroke="#16407a" stroke-width="1.6"/>
    <rect class="box" x="820" y="212" width="210" height="78" rx="6"/>
    <rect class="box" x="70" y="360" width="210" height="78" rx="6"/>
    <rect class="box" x="320" y="360" width="210" height="78" rx="6"/>
  </g>
  <g fill="#16407a">
    <rect x="70" y="212" width="4" height="78" rx="2"/>
    <rect x="320" y="212" width="4" height="78" rx="2"/>
    <rect x="570" y="212" width="4" height="78" rx="2"/>
    <rect x="820" y="212" width="4" height="78" rx="2"/>
    <rect x="70" y="360" width="4" height="78" rx="2"/>
    <rect x="320" y="360" width="4" height="78" rx="2"/>
  </g>
  <text x="177" y="246" class="label">Admission control</text>
  <text x="177" y="268" class="detail">token buckets, fair queue</text>
  <text x="427" y="246" class="label">Prefix keyer</text>
  <text x="427" y="268" class="detail">canonical bytes, hashed</text>
  <text x="677" y="246" class="label">Routing policy</text>
  <text x="677" y="268" class="detail">prefix_affinity (default)</text>
  <text x="927" y="246" class="label">Streaming proxy</text>
  <text x="927" y="268" class="detail">SSE, retry pre-first-byte</text>
  <text x="177" y="394" class="label">Health + breakers</text>
  <text x="177" y="416" class="detail">active checks, cooldown</text>
  <text x="427" y="394" class="label">KV event subscriber</text>
  <text x="427" y="416" class="detail">ZeroMQ, precise mode</text>

  <!-- Nodes: router state (datastores) -->
  <g filter="url(#lift)">
    <path d="M570,367 a105,7 0 0 1 210,0 v64 a105,7 0 0 1 -210,0 z" fill="#eef2ea" stroke="#2e6e52" stroke-width="1.2"/>
    <path d="M820,367 a105,7 0 0 1 210,0 v64 a105,7 0 0 1 -210,0 z" fill="#eef2ea" stroke="#2e6e52" stroke-width="1.2"/>
  </g>
  <path d="M570,367 a105,7 0 0 0 210,0" fill="none" stroke="#2e6e52" stroke-width="1.2"/>
  <path d="M820,367 a105,7 0 0 0 210,0" fill="none" stroke="#2e6e52" stroke-width="1.2"/>
  <text x="675" y="400" class="label">Prefix index</text>
  <text x="675" y="422" class="detail">per-replica LRU + TTL</text>
  <text x="925" y="400" class="label">Load tracker</text>
  <text x="925" y="422" class="detail">in-flight tickets, EWMA</text>

  <!-- Nodes: GPU replicas -->
  <g filter="url(#lift)">
    <rect class="box" x="70" y="548" width="210" height="78" rx="6"/>
    <rect class="box" x="320" y="548" width="210" height="78" rx="6"/>
    <rect class="box" x="570" y="548" width="210" height="78" rx="6"/>
    <rect class="box" x="820" y="548" width="210" height="78" rx="6"/>
  </g>
  <g fill="#c0432e">
    <rect x="70" y="548" width="4" height="78" rx="2"/>
    <rect x="320" y="548" width="4" height="78" rx="2"/>
    <rect x="570" y="548" width="4" height="78" rx="2"/>
    <rect x="820" y="548" width="4" height="78" rx="2"/>
  </g>
  <text x="177" y="582" class="label">vLLM replica 0</text>
  <text x="177" y="604" class="detail">Qwen2.5-1.5B, 1 GiB KV</text>
  <text x="427" y="582" class="label">vLLM replica 1</text>
  <text x="427" y="604" class="detail">Qwen2.5-1.5B, 1 GiB KV</text>
  <text x="677" y="582" class="label">vLLM replica 2</text>
  <text x="677" y="604" class="detail">Qwen2.5-1.5B, 1 GiB KV</text>
  <text x="927" y="582" class="label">vLLM replica 3</text>
  <text x="927" y="604" class="detail">Qwen2.5-1.5B, 1 GiB KV</text>

  <!-- Edge labels -->
  <g>
    <rect x="113" y="484" width="124" height="22" rx="11" fill="#f7f3eb" stroke="#67635b" stroke-opacity="0.35"/>
    <text x="175" y="499" class="pill">GET /health &#215;4</text>
    <rect x="352" y="484" width="146" height="22" rx="11" fill="#f7f3eb" stroke="#16407a" stroke-opacity="0.4"/>
    <text x="425" y="499" class="pill" fill="#16407a">KV events &#215;4, ZMQ</text>
    <rect x="768" y="314" width="84" height="22" rx="11" fill="#f7f3eb" stroke="#1a1a1f" stroke-opacity="0.25"/>
    <text x="810" y="329" class="pill">load</text>
    <rect x="982" y="314" width="72" height="22" rx="11" fill="#f7f3eb" stroke="#67635b" stroke-opacity="0.35"/>
    <text x="1018" y="329" class="pill">tickets</text>
  </g>

  <!-- Step badges on the request path -->
  <g>
    <circle cx="175" cy="174" r="11" fill="#1a1a1f"/><text x="175" y="178" class="badge">1</text>
    <circle cx="300" cy="251" r="11" fill="#1a1a1f"/><text x="300" y="255" class="badge">2</text>
    <circle cx="550" cy="251" r="11" fill="#1a1a1f"/><text x="550" y="255" class="badge">3</text>
    <circle cx="640" cy="325" r="11" fill="#1a1a1f"/><text x="640" y="329" class="badge">4</text>
    <circle cx="800" cy="251" r="11" fill="#1a1a1f"/><text x="800" y="255" class="badge">5</text>
    <circle cx="1060" cy="495" r="11" fill="#1a1a1f"/><text x="1060" y="499" class="badge">6</text>
  </g>

  <!-- Footer: request path steps -->
  <line x1="40" y1="712" x2="1080" y2="712" stroke="#1a1a1f" stroke-opacity="0.12"/>
  <text x="40" y="742" class="heading">REQUEST PATH</text>
  <g>
    <circle cx="50" cy="766" r="9" fill="#1a1a1f"/><text x="50" y="770" class="badge" font-size="10.5">1</text>
    <text x="68" y="771" class="step">Client sends an OpenAI-compatible request, streaming or not.</text>
    <circle cx="50" cy="790" r="9" fill="#1a1a1f"/><text x="50" y="794" class="badge" font-size="10.5">2</text>
    <text x="68" y="795" class="step">Admission applies tenant budgets and fair queuing; overload gets 429.</text>
    <circle cx="50" cy="814" r="9" fill="#1a1a1f"/><text x="50" y="818" class="badge" font-size="10.5">3</text>
    <text x="68" y="819" class="step">The keyer hashes canonical request bytes into a chain of block hashes.</text>
    <circle cx="50" cy="838" r="9" fill="#1a1a1f"/><text x="50" y="842" class="badge" font-size="10.5">4</text>
    <text x="68" y="843" class="step">The policy matches the chain against each replica's cache, and reads load.</text>
    <circle cx="50" cy="862" r="9" fill="#1a1a1f"/><text x="50" y="866" class="badge" font-size="10.5">5</text>
    <text x="68" y="867" class="step">The proxy takes a load ticket for the chosen replica and forwards.</text>
    <circle cx="50" cy="886" r="9" fill="#1a1a1f"/><text x="50" y="890" class="badge" font-size="10.5">6</text>
    <text x="68" y="891" class="step">Tokens stream back; a failure before the first byte retries on another replica.</text>
  </g>

  <!-- Footer: legend -->
  <text x="830" y="742" class="heading">LEGEND</text>
  <g>
    <rect x="830" y="758" width="30" height="16" rx="3" fill="#fbf8f2" stroke="#1a1a1f" stroke-opacity="0.22"/>
    <rect x="830" y="758" width="3" height="16" rx="1.5" fill="#16407a"/>
    <text x="872" y="771" class="step" font-size="13.5">Router component</text>
    <path d="M830,786 a15,3.5 0 0 1 30,0 v10 a15,3.5 0 0 1 -30,0 z" fill="#eef2ea" stroke="#2e6e52"/>
    <path d="M830,786 a15,3.5 0 0 0 30,0" fill="none" stroke="#2e6e52"/>
    <text x="872" y="795" class="step" font-size="13.5">In-memory state</text>
    <rect x="830" y="806" width="30" height="16" rx="3" fill="#fbf8f2" stroke="#1a1a1f" stroke-opacity="0.22"/>
    <rect x="830" y="806" width="3" height="16" rx="1.5" fill="#c0432e"/>
    <text x="872" y="819" class="step" font-size="13.5">Model server</text>
    <path class="request" d="M830,838 L860,838" marker-end="url(#arrow-request)"/>
    <text x="872" y="843" class="step" font-size="13.5">Request path</text>
    <path class="event" d="M830,862 L860,862" marker-end="url(#arrow-event)"/>
    <text x="872" y="867" class="step" font-size="13.5">Event stream</text>
    <path class="control" d="M830,886 L860,886" marker-end="url(#arrow-control)"/>
    <text x="872" y="891" class="step" font-size="13.5">Control plane</text>
  </g>
</svg>
