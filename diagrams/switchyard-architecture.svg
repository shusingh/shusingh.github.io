<text x="40" y="852" class="heading">REQUEST PATH</text>
<circle cx="50" cy="876" r="9" fill="#1a1a1f"/><text x="50" y="880" class="badge" font-size="10.5">1</text><text x="68" y="881" class="step">Client sends an OpenAI-compatible request, streaming or not.</text>
<circle cx="50" cy="900" r="9" fill="#1a1a1f"/><text x="50" y="904" class="badge" font-size="10.5">2</text><text x="68" y="905" class="step">Admission applies tenant budgets and fair queuing; overload gets 429.</text>
<circle cx="50" cy="924" r="9" fill="#1a1a1f"/><text x="50" y="928" class="badge" font-size="10.5">3</text><text x="68" y="929" class="step">The keyer hashes canonical request bytes into a chain of block hashes.</text>
<circle cx="50" cy="948" r="9" fill="#1a1a1f"/><text x="50" y="952" class="badge" font-size="10.5">4</text><text x="68" y="953" class="step">The policy matches the chain against each replica's cache, and reads load.</text>
<circle cx="50" cy="972" r="9" fill="#1a1a1f"/><text x="50" y="976" class="badge" font-size="10.5">5</text><text x="68" y="977" class="step">The proxy takes a load ticket for the chosen replica and forwards.</text>
<circle cx="50" cy="996" r="9" fill="#1a1a1f"/><text x="50" y="1000" class="badge" font-size="10.5">6</text><text x="68" y="1001" class="step">Tokens stream back; a failure before the first byte retries on another replica.</text>
