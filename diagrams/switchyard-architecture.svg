<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1024" width="1120" height="1024">
<title>Switchyard architecture: request path and control plane</title>
<defs>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.9" fill="#1a1a1f" fill-opacity="0.07"/>
  </pattern>
  <filter id="lift" x="-10%" y="-10%" width="120%" height="140%">
    <feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#1a1a1f" flood-opacity="0.10"/>
  </filter>
  <marker id="arrow-request" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1f"/></marker>
  <marker id="arrow-event" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16407a"/></marker>
  <marker id="arrow-control" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#67635b"/></marker>
  <style>
    .label { font-family: 'Hanken Grotesk'; font-size: 16px; font-weight: 600; fill: #1a1a1f; text-anchor: middle; }
    .detail { font-family: 'JetBrains Mono'; font-size: 12.5px; fill: #67635b; text-anchor: middle; }
    .zone { font-family: 'JetBrains Mono'; font-size: 11.5px; font-weight: 500; letter-spacing: 1.2px; }
    .pill { font-family: 'JetBrains Mono'; font-size: 11.5px; text-anchor: middle; }
    .badge { font-family: 'JetBrains Mono'; font-size: 11.5px; font-weight: 500; fill: #f7f3eb; text-anchor: middle; }
    .heading { font-family: 'JetBrains Mono'; font-size: 12px; font-weight: 500; letter-spacing: 1.4px; fill: #67635b; }
    .step { font-family: 'Hanken Grotesk'; font-size: 14.5px; fill: #3a3833; }
    .request { fill: none; stroke: #1a1a1f; stroke-width: 1.6; }
    .event { fill: none; stroke: #16407a; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .control { fill: none; stroke: #67635b; stroke-width: 1.3; stroke-dasharray: 2 4; stroke-linecap: round; }
  </style>
</defs>
